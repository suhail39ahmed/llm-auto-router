[project]
name = "llm-auto-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suhail Ahmed", email = "suhail39ahmed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "azure-ai-inference>=1.0.0b9",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-auto-router = "llm_auto_router:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
